<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배송 탭 · 영하 10도 표시 미리보기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f4f5f3}button{font-family:inherit}</style>
</helmet>
<div style="min-height: 820px; box-sizing: border-box; padding: 28px 20px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1f2620; background: #f4f5f3">
<div style="max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #fff; background: #b86b00; border-radius: 99px; padding: 3px 10px">미리보기 · 예시 기온</span>
<div style="background: #fff; border: 1px solid #e5e8e3; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><b style="font-size: 16px">2026년 12월</b><span style="flex: 1"></span><span style="font-size: 12px; color: #5f6a5c">❄ 최저 영하 10도 이하 (배송 불가)</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
<sc-for list="{{ wd }}" as="w" hint-placeholder-count="7"><span style="{{ w.s }}">{{ w.t }}</span></sc-for>
<sc-for list="{{ cells }}" as="c" hint-placeholder-count="31"><div style="{{ c.box }}"><b style="font-size: 14px">{{ c.n }}</b><small style="{{ c.ts }}">{{ c.tag }}</small></div></sc-for>
</div>
<div style="font-size: 13px; color: #3d4a3a; background: #eef4fb; border-radius: 12px; padding: 10px 12px">12/3 (목) <b style="color: #2f6db5">❄ 최저 -12° · 강원 · 배송 불가</b></div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
<button type="button" style="height: 56px; border-radius: 16px; border: 1px solid #e1e5df; background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; color: #1f2620; cursor: pointer"><span style="font-size: 18px">📅</span>마감 · 휴무 설정</button>
<button type="button" style="height: 56px; border-radius: 16px; border: 1px solid #e1e5df; background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; color: #1f2620; cursor: pointer"><span style="font-size: 18px">📢</span>공지 설정 ▾</button>
</div>
<p style="margin: 0; font-size: 12.5px; color: #5f6a5c; line-height: 1.6">· 날씨 예보(약 10일)에서 어느 지역이든 최저기온이 영하 10도 이하인 날은 달력 날짜 아래에 파란 ❄와 기온이 붙어요. 날짜를 누르면 아래에 가장 추운 지역이 나와요.<br>· 아이콘만 있던 두 버튼은 칸을 넓혀서 아이콘 + 글씨로 보여 줘요.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const cold = { 3: -12, 4: -10, 9: -11 }, first = 2, N = 31, today = 1;
    const wd = '일월화수목금토'.split('').map((t, i) => ({ t, s: 'font-size: 12px; font-weight: 700; color: ' + (i === 0 ? '#c0392b' : i === 6 ? '#2f6db5' : '#8a9186') }));
    const cells = []; for (let i = 0; i < first; i++) cells.push({ n: '', tag: '', box: '', ts: '' });
    for (let d = 1; d <= N; d++) { const w = (first + d - 1) % 7, c = cold[d];
      cells.push({ n: String(d), tag: c != null ? '❄ ' + c + '°' : w === 0 ? '휴무' : '', ts: 'font-size: 10.5px; font-weight: 700; color: ' + (c != null ? '#2f6db5' : '#c0392b'),
        box: 'display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0; border-radius: 10px; min-height: 40px; color: ' + (w === 0 ? '#c0392b' : w === 6 ? '#2f6db5' : '#1f2620') + (c != null ? '; background: #e8f1fb; box-shadow: inset 0 0 0 1px #b9d3f0' : '') + (d === 3 ? '; outline: 2px solid #2e7d4f' : '') }); }
    return { wd, cells };
  }
}
</script>
</body>
</html>
