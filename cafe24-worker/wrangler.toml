# 터미널에서 wrangler로 올릴 때만 쓰는 설정 파일이에요. (대시보드에서 붙여넣기로 만들면 필요 없어요)
name = "herb5-cafe24"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
CAFE24_MALL_ID = "쇼핑몰아이디"
CAFE24_CLIENT_ID = "WjERtf1WV6AEJq9XbVfHwH"
REDIRECT_URI = "https://herb5-i.github.io/herb5_order/"
FIREBASE_PROJECT = "herb5-order"
ALLOWED_ORIGIN = "https://herb5-i.github.io"

[[kv_namespaces]]
binding = "TOKENS"
id = "KV_ID"

[triggers]
crons = ["0 18 * * *"]
# CAFE24_CLIENT_SECRET 은 여기에 쓰지 말고: npx wrangler secret put CAFE24_CLIENT_SECRET
